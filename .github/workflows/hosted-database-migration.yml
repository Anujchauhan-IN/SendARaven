name: Hosted Database Migration

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Exact 20-character Supabase project reference
        required: true
        type: string
      confirmation:
        description: Type DEPLOY followed by a space and the exact project reference
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hosted-supabase-database-deployment
  cancel-in-progress: false

jobs:
  verify-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: hosted-supabase
    env:
      SUPABASE_ENV: ci

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify branch, target and required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          REQUESTED_PROJECT_REF: ${{ inputs.project_ref }}
          DEPLOYMENT_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Hosted migrations may run only from main." >&2
            exit 1
          fi

          if [[ -z "${SUPABASE_ACCESS_TOKEN}" || -z "${SUPABASE_DB_PASSWORD}" || -z "${SUPABASE_PROJECT_REF}" ]]; then
            echo "Required hosted Supabase secrets are missing." >&2
            exit 1
          fi

          if [[ ! "${SUPABASE_PROJECT_REF}" =~ ^[a-z]{20}$ ]]; then
            echo "Configured SUPABASE_PROJECT_REF is not a valid 20-character project reference." >&2
            exit 1
          fi

          if [[ "${REQUESTED_PROJECT_REF}" != "${SUPABASE_PROJECT_REF}" ]]; then
            echo "Requested project does not match the configured hosted project." >&2
            exit 1
          fi

          if [[ "${DEPLOYMENT_CONFIRMATION}" != "DEPLOY ${SUPABASE_PROJECT_REF}" ]]; then
            echo "Deployment confirmation did not match the required phrase." >&2
            exit 1
          fi

          echo "Hosted project target verified."

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ^3

      - name: Initialize temporary local configuration
        shell: bash
        run: |
          if [[ ! -f supabase/config.toml && ! -f supabase/config.jsonc && ! -f supabase/config.json ]]; then
            supabase init
          fi

      - name: Start temporary database and apply migrations
        run: supabase db start

      - name: Rebuild database from repository migrations
        run: supabase db reset

      - name: Run all database assertions before deployment
        run: supabase test db

      - name: Stop temporary Supabase environment
        run: supabase stop --no-backup

      - name: Link the explicitly verified hosted project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Reject hosted migration versions absent from Git
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bash scripts/database/verify-supabase-migration-history.sh compatible

      - name: Preview pending hosted migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run --remote

      - name: Stop temporary Supabase environment after failure
        if: failure()
        run: supabase stop --no-backup || true

  deploy:
    needs: verify-and-preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: hosted-supabase
    env:
      SUPABASE_ENV: ci

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Reverify approved deployment target
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          REQUESTED_PROJECT_REF: ${{ inputs.project_ref }}
          DEPLOYMENT_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ -n "${SUPABASE_ACCESS_TOKEN}" ]]
          [[ -n "${SUPABASE_DB_PASSWORD}" ]]
          [[ "${SUPABASE_PROJECT_REF}" =~ ^[a-z]{20}$ ]]
          [[ "${REQUESTED_PROJECT_REF}" == "${SUPABASE_PROJECT_REF}" ]]
          [[ "${DEPLOYMENT_CONFIRMATION}" == "DEPLOY ${SUPABASE_PROJECT_REF}" ]]

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ^3

      - name: Initialize temporary local configuration
        shell: bash
        run: |
          if [[ ! -f supabase/config.toml && ! -f supabase/config.jsonc && ! -f supabase/config.json ]]; then
            supabase init
          fi

      - name: Link the explicitly verified hosted project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Recheck migration history immediately before deployment
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bash scripts/database/verify-supabase-migration-history.sh compatible

      - name: Recheck pending migrations immediately before deployment
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run --remote

      - name: Apply pending migrations to hosted project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --yes --remote

      - name: Verify hosted migration history exactly matches Git
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bash scripts/database/verify-supabase-migration-history.sh exact

      - name: Verify no migrations remain pending
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          dry_run_output="$(supabase db push --dry-run --remote 2>&1)"
          printf '%s\n' "${dry_run_output}"

          if grep -Fq "Would push migration" <<< "${dry_run_output}"; then
            echo "One or more repository migrations remain pending after deployment." >&2
            exit 1
          fi

      - name: Verify public and private schemas match repository migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          drift_file="${RUNNER_TEMP}/supabase-schema-drift.sql"
          supabase db diff --remote --schema public,private > "${drift_file}"

          if grep -q '[^[:space:]]' "${drift_file}"; then
            echo "Hosted schema drift remains after deployment:" >&2
            cat "${drift_file}" >&2
            exit 1
          fi

          echo "Hosted public and private schemas match repository migrations."

      - name: Verify the Phase 3A auth trigger
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          result_file="${RUNNER_TEMP}/phase-3a-hosted-verification.json"
          supabase db query \
            --file supabase/verification/phase_3a_hosted.sql \
            --read-only \
            --remote \
            --output json > "${result_file}"

          node - "${result_file}" <<'NODE'
          const fs = require('node:fs');
          const parsed = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const row = Array.isArray(parsed) ? parsed[0] : parsed;

          if (
            row?.phase_3a_auth_trigger_valid !== true
          ) {
            console.error('Phase 3A auth trigger verification failed.');
            process.exit(1);
          }

          console.log('Phase 3A auth trigger verification passed.');
          NODE
