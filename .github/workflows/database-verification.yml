name: Database Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ^3

      - name: Initialize temporary local configuration
        shell: bash
        run: |
          if [[ ! -f supabase/config.toml && ! -f supabase/config.jsonc && ! -f supabase/config.json ]]; then
            supabase init
          fi

      - name: Start temporary database and apply migrations
        run: supabase db start

      - name: Rebuild database from repository migrations
        run: supabase db reset

      - name: Run Phase 3A pgTAP database tests
        run: supabase test db

      - name: Ensure verification did not rewrite tracked database files
        run: git diff --exit-code -- supabase/migrations supabase/tests

      - name: Stop temporary Supabase environment
        if: always()
        run: supabase stop --no-backup || true
